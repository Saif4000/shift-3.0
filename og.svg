<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid meet">
  <!-- background -->
  <rect width="1200" height="630" fill="#000"/>

  <!-- grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#ffaa00" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="ambGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b07600"/><stop offset="1" stop-color="#ffaa00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- corner brackets -->
  <path d="M30 30 H90 M30 30 V90" stroke="#ffaa00" stroke-width="4" fill="none"/>
  <path d="M1170 30 H1110 M1170 30 V90" stroke="#ffaa00" stroke-width="4" fill="none"/>
  <path d="M30 600 H90 M30 600 V540" stroke="#ffaa00" stroke-width="4" fill="none"/>
  <path d="M1170 600 H1110 M1170 600 V540" stroke="#ffaa00" stroke-width="4" fill="none"/>

  <!-- top status chip -->
  <rect x="80" y="80" width="180" height="28" fill="#00e676"/>
  <text x="94" y="100" font-family="'JetBrains Mono','Menlo',monospace" font-size="14" font-weight="700" fill="#000" letter-spacing="2">● LIVE · 22 FEEDS</text>

  <text x="280" y="100" font-family="'JetBrains Mono','Menlo',monospace" font-size="14" fill="#aaa" letter-spacing="2">// REGIONAL INTEL TERMINAL · v2.0</text>

  <!-- big brand -->
  <rect x="76" y="160" width="10" height="180" fill="#00e676"/>
  <text x="110" y="290" font-family="'JetBrains Mono','Menlo',monospace" font-size="160" font-weight="900" fill="#ffaa00" letter-spacing="6">SHIFT</text>
  <text x="660" y="290" font-family="'JetBrains Mono','Menlo',monospace" font-size="160" font-weight="300" fill="#fff" letter-spacing="6">2.0</text>

  <!-- amber strip with tagline -->
  <rect x="76" y="330" width="660" height="36" fill="#ffaa00"/>
  <text x="92" y="356" font-family="'JetBrains Mono','Menlo',monospace" font-size="16" font-weight="700" fill="#000" letter-spacing="3">SECURITY · POLITICS · ECONOMY · AI · MARKETS</text>

  <!-- mil status chips row -->
  <g font-family="'JetBrains Mono','Menlo',monospace" font-size="13" font-weight="700" letter-spacing="1">
    <rect x="76"  y="400" width="120" height="32" fill="none" stroke="#ffaa00" stroke-width="1.5"/>
    <text x="138" y="421" text-anchor="middle" fill="#ffaa00">UAE · GCC</text>

    <rect x="206" y="400" width="120" height="32" fill="none" stroke="#5fc7ff" stroke-width="1.5"/>
    <text x="266" y="421" text-anchor="middle" fill="#5fc7ff">ISRAEL · IDF</text>

    <rect x="336" y="400" width="120" height="32" fill="none" stroke="#ff6ad5" stroke-width="1.5"/>
    <text x="396" y="421" text-anchor="middle" fill="#ff6ad5">HORMUZ</text>

    <rect x="466" y="400" width="120" height="32" fill="none" stroke="#ff3344" stroke-width="1.5"/>
    <text x="526" y="421" text-anchor="middle" fill="#ff3344">TENSIONS</text>

    <rect x="596" y="400" width="120" height="32" fill="none" stroke="#b794ff" stroke-width="1.5"/>
    <text x="656" y="421" text-anchor="middle" fill="#b794ff">AI · TECH</text>

    <rect x="726" y="400" width="120" height="32" fill="none" stroke="#00e676" stroke-width="1.5"/>
    <text x="786" y="421" text-anchor="middle" fill="#00e676">LIVE TV</text>
  </g>

  <!-- bottom mil-readout -->
  <g font-family="'JetBrains Mono','Menlo',monospace" font-size="14" fill="#666" letter-spacing="1">
    <text x="80"  y="510">▸ BLOOMBERG · NYT · WSJ · CNN · REUTERS · AP · BBC</text>
    <text x="80"  y="532">▸ AL JAZEERA · TIMES OF ISRAEL · JPOST · ARAB NEWS · WAM</text>
    <text x="80"  y="554">▸ GDELT 2.0 · OPENSKY · WHO · UN · STOOQ · FRANKFURTER · COINGECKO</text>
  </g>

  <!-- progress bar accent -->
  <rect x="80" y="582" width="1040" height="3" fill="#1a1a1a"/>
  <rect x="80" y="582" width="720" height="3" fill="url(#ambGrad)"/>

  <!-- bottom right tag -->
  <text x="1120" y="556" text-anchor="end" font-family="'JetBrains Mono','Menlo',monospace" font-size="11" fill="#555" letter-spacing="1">▮ NO AI SLOP · CITATIONS ONLY</text>
</svg>
